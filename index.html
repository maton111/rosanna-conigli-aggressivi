<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1e">
  <title>Rosanna e i Conigli Aggressivi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2358b84c'/%3E%3Crect x='4' y='2' width='2' height='5' fill='%23fff'/%3E%3Crect x='10' y='2' width='2' height='5' fill='%23fff'/%3E%3Crect x='3' y='7' width='10' height='7' fill='%23fff'/%3E%3Crect x='5' y='9' width='2' height='2' fill='%23f00'/%3E%3Crect x='9' y='9' width='2' height='2' fill='%23f00'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== SCHERMATA TITOLO ===== -->
    <section id="title-screen" class="screen active" aria-label="Schermata iniziale">
      <canvas id="title-canvas" width="360" height="640"></canvas>
      <div class="title-ui">
        <h1 class="game-title">
          <span class="line big">ROSANNA</span>
          <span class="line small">E I</span>
          <span class="line big">CONIGLI</span>
          <span class="line big">AGGRESSIVI</span>
        </h1>
        <button id="start-btn" class="pixel-btn start-btn" type="button">START</button>
        <p class="press-start">PRESS START</p>
        <p class="title-credits">un regalo per Rosanna ♥</p>
      </div>
    </section>

    <!-- ===== SCHERMATA GIOCO ===== -->
    <section id="game-screen" class="screen" aria-label="Prato dei conigli">
      <canvas id="game-canvas" width="360" height="640"></canvas>

      <!-- fumetti dei conigli (posizionati via JS) -->
      <div id="overlay" class="overlay" aria-live="polite"></div>

      <!-- HUD -->
      <div id="hud" class="hud">
        <div class="hud-row">
          <button id="home-btn" class="pixel-btn hud-btn" type="button" title="Torna alla home">⌂ HOME</button>
          <button id="quest-btn" class="pixel-btn hud-btn" type="button" title="Apri le quest" aria-expanded="false">
            ✎ QUEST <span id="quest-count">0/5</span>
          </button>
        </div>
        <div id="hidden-text" class="hidden-text" title="Completa le quest per svelare il messaggio"></div>
      </div>

      <!-- pannello quest -->
      <div id="quest-panel" class="quest-panel" hidden>
        <div class="quest-panel-head">
          <span>✎ QUEST</span>
          <button id="quest-close" class="pixel-btn tiny" type="button" aria-label="Chiudi">X</button>
        </div>
        <ul id="quest-list" class="quest-list"></ul>
        <div class="quest-panel-foot">
          <button id="mute-btn" class="link-btn" type="button">♪ suoni: ON</button>
          <button id="reset-btn" class="link-btn danger" type="button">reset progresso</button>
        </div>
      </div>

      <!-- toast quest completata -->
      <div id="toast" class="toast" hidden></div>

      <!-- banner finale -->
      <div id="final-banner" class="final-banner" hidden>
        <div class="final-box">
          <p class="final-title">★ QUEST COMPLETATA ★</p>
          <p id="final-text" class="final-text"></p>
          <button id="final-close" class="pixel-btn" type="button">CONTINUA</button>
        </div>
      </div>
    </section>

    <div id="fade" class="fade"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
